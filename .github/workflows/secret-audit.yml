name: Secret audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Scan tracked files without echoing matches
        shell: pwsh
        run: ./scripts/audit-secrets.ps1 -TrackedOnly

  history-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
